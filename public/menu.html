<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Blissri the Bakeshoppe</title>
  <meta name="description" content="Browse Blissri's full menu of cookies, cupcakes, dessert bars, drinks and Bliss Boxes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20fill%3D%22%23ef7fae%22%3E%3Cellipse%20cx%3D%2219%22%20cy%3D%2223%22%20rx%3D%2215%22%20ry%3D%2211%22%20transform%3D%22rotate(-18%2019%2023)%22%2F%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2242%22%20rx%3D%2211%22%20ry%3D%228%22%20transform%3D%22rotate(20%2020%2042)%22%2F%3E%3Cellipse%20cx%3D%2245%22%20cy%3D%2223%22%20rx%3D%2215%22%20ry%3D%2211%22%20transform%3D%22rotate(18%2045%2023)%22%2F%3E%3Cellipse%20cx%3D%2244%22%20cy%3D%2242%22%20rx%3D%2211%22%20ry%3D%228%22%20transform%3D%22rotate(-20%2044%2042)%22%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%22%231e3a8a%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M32%2015%20C34%2027%2034%2037%2032%2050%22%20stroke-width%3D%223.4%22%2F%3E%3Cpath%20d%3D%22M32%2016%20C29%2011%2026%209%2023%208%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M32%2016%20C35%2011%2038%209%2041%208%22%20stroke-width%3D%222%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="page-hero">
    <div class="container">
      <h1>Our Menu</h1>
      <p>Everything is baked fresh daily with real, simple ingredients.</p>
      <div class="breadcrumb"><a href="index.html">Home</a> / Menu</div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="menuSections">
        <p class="muted center" style="padding:40px;">Loading the menu… 🧁</p>
      </div>
      <div class="center" style="margin-top:46px;">
        <a class="btn btn-primary" href="order.html">Order for Pickup →</a>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/site.js"></script>
  <script src="js/cart.js"></script>
  <script>
    (function () {
      function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
      document.addEventListener("blissri:menu-ready", function (e) {
        var menu = e.detail, host = document.getElementById("menuSections");
        host.innerHTML = (menu.categories || []).map(function (cat) {
          var items = (menu.items || []).filter(function (it) { return it.category === cat.id; });
          if (!items.length) return "";
          var cards = items.map(function (it) {
            var badge = it.badge ? '<span class="tag">' + esc(it.badge) + '</span>' : '';
            var thumb = it.img ? '<img src="' + esc(it.img) + '" alt="' + esc(it.name) + '" loading="lazy">' : (it.emoji || "🧁");
            return '<article class="card"><div class="thumb">' + thumb + '</div>' +
              '<div class="body">' + badge + '<h3>' + esc(it.name) + '</h3>' +
              '<p>' + esc(it.desc || "") + '</p>' +
              '<div class="meta"><span class="price">$' + Number(it.price).toFixed(2) + '</span>' +
              '<a class="btn btn-ghost btn-sm" href="order-lantana.html">Order</a></div></div></article>';
          }).join("");
          return '<div style="margin-bottom:54px;">' +
            '<div class="section-head" style="margin-bottom:30px;"><span class="eyebrow">' + (cat.emoji || "") + '</span><h2>' + esc(cat.name) + '</h2></div>' +
            '<div class="cards">' + cards + '</div></div>';
        }).join("");
      });
    })();
  </script>
</body>
</html>
